name: HY2 feature parity
on:
  push:
    branches: [main, feature/hy2-jieshu-parity]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated bundle and regression cases
        run: |
          set -euo pipefail
          python3 -B tests/check_bundle.py
          python3 -B -m unittest discover -s tests -v
          git diff --check
      - name: Verify official HY2 core and exercise loopback TCP and UDP
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 120 'https://github.com/HyNetworks/hysteria/releases/download/app/v2.13.0/hysteria-linux-amd64' -o /tmp/hysteria-hy2-test
          printf '%s\n' '907ba8c9693edb104b20582681fb7dc15639d5b64a9cbb616a7b539190a86691  /tmp/hysteria-hy2-test' | sha256sum -c -
          chmod 700 /tmp/hysteria-hy2-test
          python3 -B tests/hy2_loopback.py /tmp/hysteria-hy2-test
  windows-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          foreach ($name in @('helan_round4.ps1', 'helan_onepass.ps1')) {
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('tests/' + $name)), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
          & ./tests/helan_onepass.ps1 -SelfTest
      - name: Exercise the official Windows HY2 core
        shell: pwsh
        run: |
          & ./tests/helan_round4.ps1 -SelfTest
  extras-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install actual SOCKS core and network lab tools
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive bash socks5-install.sh deps
          sudo systemctl disable --now 3proxy.service || true
      - name: Verify real rate limits, SOCKS protections and blacklist packets
        run: |
          set -euo pipefail
          export HY2_TEST_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=HY2_TEST_HOST_NETNS timeout --kill-after=5s 650s unshare --net -- python3 -B tests/hy2_extras_kernel.py suite --work /tmp/hy2-extras-ci-report
