name: HY2 release checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hy2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checker
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash source syntax
        run: |
          set -Eeuo pipefail
          for file in hy2.sh nat.sh vpswg.sh natjichang.sh; do bash -n "$file"; done
      - name: Unit and generated Bash syntax tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: All nested Bash/Python and ShellCheck
        run: python3 tools/check_generated.py
      - name: Execute actual generators and verify systemd files
        run: python3 tools/render_install.py "$RUNNER_TEMP/hy2-render"
  kernel-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable namespace lab dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables iptables iproute2 iputils-ping
      - name: Real kernel forwarding and nft enforcement (isolated namespaces)
        run: sudo python3 tests/netns_lab.py
